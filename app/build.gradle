plugins {
    id 'com.android.application'
}

android {
    namespace 'id.cidz.bridge'
    compileSdk 34

    defaultConfig {
        applicationId "id.cidz.bridge"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero third-party dependencies! Menggunakan framework Android native.
}
